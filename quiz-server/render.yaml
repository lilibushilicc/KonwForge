# Render 部署清单：后端（FastAPI）→ Render Web Service，数据库 → Neon (PostgreSQL)
# 用法：Render 控制台 New → Blueprint → 关联本仓库，或直接 New Web Service 选本目录。
# 部署后到 Environment 里补齐下面标 sync:false 的变量（DB_URL 填 Neon 连接串）。
services:
  - type: web
    name: quiz-server
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # 首次部署 / 每次发版先跑迁移，保证表结构与代码一致
    releaseCommand: alembic upgrade head
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DB_URL
        sync: false # 粘贴 Neon 连接串，形如 postgresql+psycopg://user:pass@.../neondb?sslmode=require
      - key: CORS_ORIGINS
        sync: false # 前端域名，逗号分隔或 JSON 数组，如 https://quiz.example.com
      - key: PORT
        sync: false # Render 自动注入，无需手动填
      - key: DEBUG
        value: "false"
