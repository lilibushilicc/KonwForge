# Render 部署清单（仓库根，monorepo）：
# 服务从 quiz-server/ 子目录构建；数据库用 Neon（外部，见 DB_URL）。
# 用法：
#   1) 本地已推送本文件到 GitHub（Render 需要能访问该仓库，私有仓库需在
#      Render 控制台装 GitHub App 并授权该 repo）
#   2) Render New Blueprint 关联仓库，或在 CLI：render services create
#      环境变量里 DB_URL / CORS_ORIGINS 为 sync:false，需在控制台或 CLI 补值。
services:
  - type: web
    name: quiz-server
    runtime: python  # 具体版本用 quiz-server/.python-version 锁定（Render 忽略 runtime.txt / PYTHON_VERSION 简写）
    rootDir: quiz-server
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    # 迁移与启动串在一起：Render release/pre-deploy 阶段拿不到 env，在 start 阶段跑 alembic 才能连库
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        sync: false # 数据库 DSN：本地用 postgresql+psycopg://，线上用 libsql://（Turso），形如 libsql://<org>-<db>.turso.io/<db>?authToken=...
      - key: CORS_ORIGINS
        sync: false # 前端域名，逗号分隔或 JSON 数组
      - key: DEBUG
        value: "false"
